# Review automatique de chaque PR (vers dev, et PR de release vers main).
# L'agent commente uniquement : il ne pousse rien et n'approuve/merge jamais.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [dev, main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: .claude/settings.json
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.head_ref }} → ${{ github.base_ref }})

            Tu es le relecteur du jeu web "incrémental compétitif" (TypeScript full-stack,
            reset hebdomadaire de campagne, améliorations permanentes). Lis CLAUDE.md d'abord.

            Relis le diff de cette PR et commente EN FRANÇAIS. Priorités, dans l'ordre :
            1. Bugs et régressions (logique de jeu, calculs de production/coûts, arrondis, overflow de grands nombres).
            2. Triche / sécurité : toute ressource, score ou progression doit être calculée ou validée côté serveur ;
               jamais de confiance au client ; validation des entrées ; rate limiting sur les actions.
            3. Reset hebdomadaire : ce qui est remis à zéro vs conservé (méta-progression), idempotence du reset,
               fuseaux horaires (tout en UTC), migrations de données.
            4. Tests manquants pour la logique modifiée.
            5. Équilibrage : signale les courbes de coût/production qui explosent ou stagnent.
            Ignore le style pur (le linter s'en charge).

            Si la PR cible main : vérifie qu'elle vient bien de dev et résume les risques de mise en prod.

            Utilise les commentaires inline pour les problèmes précis, puis UN commentaire de synthèse
            (gh pr comment) avec un verdict : ✅ OK pour merge / ⚠️ à corriger / ⛔ bloquant.
            Tu n'approuves jamais et tu ne merges jamais.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *),Bash(git diff*),Bash(git log*)"
