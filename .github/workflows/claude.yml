# Agent Claude "à la demande" :
#  - mentionner @claude dans une issue / PR / review ;
#  - ou poser le label "claude" sur une issue → Claude implémente, ouvre une PR vers dev et active l'auto-merge.
# Pour enchaîner automatiquement toute la roadmap, voir pilot.yml.
# Seuls les utilisateurs avec droit d'écriture sur le repo peuvent déclencher l'agent.
name: Claude agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev            # toutes les branches de l'agent partent de dev
          branch_prefix: claude/
          label_trigger: claude
          settings: .claude/settings.json   # hooks garde-fous (jamais de push sur main/dev)
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(npm run *),Bash(npm ci),Bash(npm install *),Bash(npx vitest *),Bash(npx tsc *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git add *),Bash(git commit *),Bash(git checkout -b claude/*),Bash(git push*),Bash(gh pr create *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh pr merge *),Bash(gh issue view *),Bash(gh issue comment *)"
            --disallowedTools "Bash(gh pr merge * --admin*),Bash(gh workflow run*),Bash(gh release*),Bash(git push --force*),Bash(git push -f*)"
